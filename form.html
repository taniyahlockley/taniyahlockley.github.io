<!DOCTYPE html>
<html>
    <head>
        <title>Form Validation</title>
        <script src="validation.js"></script>
    </head>

    <body>
        <form name="Info">
            <table>
                <tr>
                    <td class="label"><label for="username">Username:</label></td>
                    <td><input type="text" id="username" name="username"></td>
                </tr>
                <tr>
                    <td class="label"><label for="email">Email:</label></td>
                    <td><input type="text" id="email" name="email"></td>
                </tr>
                <tr>
                    <td class="label"><label for="phone">Phone number:</label></td>
                    <td><input type="text" id="phone" name="phone"></td>
                </tr>
                <tr>
                    <td class="label"><label for="password">Password:</label></td>
                    <td><input type="password" id="password" name="password"></td>
                </tr>
                <tr>
                    <td class="label"><label for="confirmPassword">Confirm Password:</label></td>
                    <td><input type="password" id="confirmPassword" name="confirmPassword"></td>
                </tr>
                <tr>
                    <td class="label"><label for="gender">Gender:</label></td>
                    <td>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                        <input type="radio" id="other" name="gender" value="other">
                        <label for="other">Other</label>
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="age">Age Group:</label></td>
                    <td>
                        <select id="age">
                            <option value=""></option>
                            <option value="under21">Under 21 years old</option>
                            <option value="21-25">21 to 25 years old</option>
                            <option value="26-35">26 to 35 years old</option>
                            <option value="36-50">36 to 50 years old</option>
                            <option value="51+">51 years old and above</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label"><label>Music Genre:</label></td>
                    <td>
                        <input type="checkbox" name="music" value="pop">Pop
                        <input type="checkbox" name="music" value="HipHop">HipHop
                        <input type="checkbox" name="music" value="Rock">Rock
                        <input type="checkbox" name="music" value="Jazz">Jazz
                        <input type="checkbox" name="music" value="Classical">Classical
                        <input type="checkbox" name="music" value="Country">Country
                    </td>
                </tr>
            </table>
            
            <button type="button" onclick="validateForm()">Submit</button>
            <button type="reset" onclick="clearErrors()">Reset</button>
            <div id="validation"></div>
        </form>
    </body>
</html>
